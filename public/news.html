<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>お知らせ | Terraria JP</title>
        <!-- 仮テキスト。実際の説明文に差し替える -->
        <meta name="description" content="Terraria JP からのお知らせの一覧です。" />
        <link rel="stylesheet" href="assets/css/style.css" />
    </head>

    <body>
        <!-- 共通ヘッダ（assets/js/components/site-header.js） -->
        <x-site-header></x-site-header>

        <main class="l-main">
            <header class="c-page-header">
                <div class="l-container l-container--narrow">
                    <p class="c-page-header__lead">Terraria JP からのお知らせ</p>
                    <h1 class="c-page-header__title">お知らせ</h1>
                </div>
            </header>

            <!--
                これからのイベント。Discord の「イベント」に立てたものが自動で出る。
                中身は assets/js/pages/news.js が /api/events から取って入れる。
                1 件も無いとき・取れなかったときは、かたまりごと出さない（hidden のまま）。
            -->
            <section class="p-news-events" data-news-events hidden>
                <div class="l-container l-container--narrow">
                    <h2 class="p-news-events__title">これからのイベント</h2>
                    <ul class="p-news-events__list" data-news-events-list></ul>
                    <p class="p-news-events__note">
                        Discord の「イベント」に立てたものが、そのまま出ています。
                    </p>
                </div>
            </section>

            <div class="l-container l-container--narrow">
                <div class="p-news-list">
                    <!--
                        仮テキスト。記事を足すときは、この <details> のかたまりを
                        まるごとコピーして、日付・タイトル・本文を書き換える。
                        日付は datetime に 2026-10-19 の形、表示は 2026.10.19 の形にする。
                        新しい記事は上に置く。
                    -->
                    <details class="p-news-item">
                        <summary class="p-news-item__summary">
                            <time class="p-news-item__date" datetime="2026-10-19">2026.10.19</time>
                            <span class="p-news-item__title"
                                >Terraria JP の公式サイトを公開しました</span
                            >
                        </summary>
                        <div class="p-news-item__body">
                            <p>仮テキスト。</p>
                        </div>
                    </details>

                    <details class="p-news-item">
                        <summary class="p-news-item__summary">
                            <time class="p-news-item__date" datetime="2026-10-10">2026.10.10</time>
                            <span class="p-news-item__title"
                                >Discord サーバーの紹介ページを追加しました</span
                            >
                        </summary>
                        <div class="p-news-item__body">
                            <p>仮テキスト。</p>
                        </div>
                    </details>

                    <details class="p-news-item">
                        <summary class="p-news-item__summary">
                            <time class="p-news-item__date" datetime="2026-09-28">2026.09.28</time>
                            <span class="p-news-item__title"
                                >新ワールドの参加者を募集しています</span
                            >
                        </summary>
                        <div class="p-news-item__body">
                            <p>仮テキスト。</p>
                        </div>
                    </details>
                </div>
            </div>
        </main>

        <!-- 共通フッター（assets/js/components/site-footer.js） -->
        <x-site-footer></x-site-footer>

        <script src="assets/js/components/site-header.js" defer></script>
        <script src="assets/js/components/site-footer.js" defer></script>
        <script src="assets/js/pages/news.js" defer></script>
    </body>
</html>
