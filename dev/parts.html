<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>共通パーツ プレビュー（開発用）</title>
        <link rel="stylesheet" href="../assets/css/style.css" />
    </head>

    <body>
        <x-site-header></x-site-header>

        <main class="l-main">
            <header class="c-page-header">
                <div class="l-container l-container--narrow">
                    <p class="c-page-header__lead">開発用</p>
                    <h1 class="c-page-header__title">共通パーツ プレビュー</h1>
                </div>
            </header>

            <div class="l-container l-container--narrow">
                <p>
                    開発用のページです。共通パーツ（ヘッダーなど）の見た目をここで確認します。
                    新しいパーツを足したら、このページに並べて確認できるようにする。
                </p>

                <h2>見出し</h2>
                <p><code>h1</code> から <code>h2</code> までの見た目を確認するための文章です。</p>

                <h2>ボタン</h2>
                <p>
                    <button class="c-button" type="button">ボタン（button）</button>
                </p>

                <h2>ページの導入（c-page-header）</h2>
                <p>お知らせ・サーバー紹介などの下層ページの見出しに使う。</p>
                <div class="c-page-header">
                    <p class="c-page-header__lead">リード文（何のページか）</p>
                    <h3 class="c-page-header__title">ページの見出し</h3>
                    <p class="c-page-header__text">説明文。必要なページではここに文章を足す。</p>
                    <p class="c-page-header__actions">
                        <button class="c-button" type="button">ボタン（button）</button>
                    </p>
                </div>
            </div>
        </main>

        <x-site-footer></x-site-footer>

        <script src="../assets/js/components/site-header.js" defer></script>
        <script src="../assets/js/components/site-footer.js" defer></script>
    </body>
</html>
