<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <title>共通パーツ プレビュー（開発用）</title>
        <link rel="stylesheet" href="../assets/css/style.css" />
    </head>

    <body>
        <x-site-header></x-site-header>

        <main class="l-main">
            <div class="l-container">
                <h1>共通パーツ プレビュー</h1>
                <p>
                    開発用のページです。共通パーツ（ヘッダーなど）の見た目をここで確認します。
                    新しいパーツを足したら、このページに並べて確認できるようにする。
                </p>

                <h2>見出し</h2>
                <p><code>h1</code> から <code>h2</code> までの見た目を確認するための文章です。</p>

                <h2>ボタン</h2>
                <p>
                    <button class="c-button" type="button">ボタン（button）</button>
                </p>
            </div>
        </main>

        <footer class="l-footer">
            <p><small>開発用ページ</small></p>
        </footer>

        <script src="../assets/js/components/site-header.js" defer></script>
    </body>
</html>
